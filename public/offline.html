<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Urpaq.ai — Нет подключения</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: white; padding: 24px; text-align: center;
        }
        .card {
            max-width: 400px; width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px; padding: 40px 32px;
            backdrop-filter: blur(12px);
        }
        .logo {
            width: 72px; height: 72px; border-radius: 18px;
            margin: 0 auto 24px; overflow: hidden;
        }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.6); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
        .icon { font-size: 3.5rem; margin-bottom: 20px; display: block; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 13px 28px;
            background: linear-gradient(135deg,#6366f1,#8b5cf6);
            color: white; border: none; border-radius: 14px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            text-decoration: none; transition: opacity 0.2s;
            box-shadow: 0 8px 24px rgba(99,102,241,0.35);
        }
        .btn:hover { opacity: 0.9; }
        .tips {
            margin-top: 24px; padding: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px; text-align: left;
        }
        .tips p { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 0; }
        .tips ul { list-style: none; margin-top: 8px; }
        .tips li { font-size: 0.82rem; color: rgba(255,255,255,0.55); padding: 4px 0; display: flex; gap: 8px; }
        .tips li::before { content: '•'; color: #6366f1; font-weight: 900; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="/logo.jpg" alt="Urpaq.ai" onerror="this.parentElement.innerHTML='<div style=\'background:linear-gradient(135deg,#6366f1,#8b5cf6);width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4rem\'>U</div>'" />
        </div>
        <span class="icon">📡</span>
        <h1>Нет подключения</h1>
        <p>
            Похоже, вы не в сети. Проверьте интернет-подключение и попробуйте снова.
        </p>
        <a href="/" class="btn" onclick="window.location.reload(); return false;">
            ↻ Попробовать снова
        </a>
        <div class="tips">
            <p>Пока нет сети, вы можете:</p>
            <ul>
                <li>Просмотреть кэшированные страницы</li>
                <li>Подготовить конспект оффлайн</li>
                <li>Вернуться когда появится сеть</li>
            </ul>
        </div>
    </div>
</body>
</html>
