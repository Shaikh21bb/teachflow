<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Display -->
    <meta name="theme-color" content="#245fb5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="URPAQ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="URPAQ" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO / OG -->
    <meta name="description" content="URPAQ: уроки, задания и учебные игры. Рабочее пространство учителя и ученика." />
    <meta property="og:title" content="URPAQ — образовательная платформа" />
    <meta property="og:description" content="Уроки, задания и учебные игры для учителей и школьников" />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:type" content="website" />

    <!-- Splash screen color for iOS -->
    <meta name="msapplication-TileColor" content="#245fb5" />

    <title>URPAQ — образовательная платформа</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Check for updates every 60 minutes
              setInterval(() => reg.update(), 60 * 60 * 1000);
            })
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
