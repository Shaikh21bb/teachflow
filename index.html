<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Display -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Urpaq.ai" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Urpaq.ai" />

    <!-- Viewport — no user scaling for native feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- SEO / OG -->
    <meta name="description" content="Urpaq.ai — AI-платформа для учителей. Создавайте уроки, квизы, управляйте классами." />
    <meta property="og:title" content="Urpaq.ai — Суперсила для учителей" />
    <meta property="og:description" content="AI-платформа нового поколения для учителей Казахстана" />
    <meta property="og:image" content="/logo.jpg" />
    <meta property="og:type" content="website" />

    <!-- Splash screen color for iOS -->
    <meta name="msapplication-TileColor" content="#6366f1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Urpaq.ai — Суперсила для учителей</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Check for updates every 60 minutes
              setInterval(() => reg.update(), 60 * 60 * 1000);
            })
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
